[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "panelforge"
version = "0.1.0"
description = "Visual-canon-first panel generation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.52,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
