[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "panelforge"
version = "1.0.0"
description = "Visual-canon-first panel generation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7,<1",
    "numpy>=1.26,<3",
    "Pillow>=12.1.1,<13",
    "fastapi>=0.115,<1",
    "openai>=1.52,<3",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"panelforge.infrastructure" = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.md"]
